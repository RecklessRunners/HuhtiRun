<!DOCTYPE html>
<html lang="fi">
 	<head>
		<title>HuhtiRun</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="img/favicon.png">
		<link rel="manifest" href="manifest.webmanifest">
		<meta name="theme-color" content="#000000" />

		<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700|Fondamento|Raleway:800,500|Playfair+Display:700italic" rel="stylesheet" />
		<link href="css/styles.css" rel="stylesheet" />

		<script type="module" src="js/main.ts"></script>
		<script>
			if("serviceWorker" in navigator){
				window.addEventListener("load", function(){
					navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("Service workerin rekisteröinti epäonnistui", e); });
				});
			}
		</script>
	</head>
	<body>
		<dialog id="noMoneyModal" class="modal">
			<h2 style="color:#C00000;">&#9888;&ensp;Rahasi eivät riitä!</h2>
			<p>Ostaaksesi kohteen <b><span id="lisaaRahaaTuote"></span></b>, tarvitset <b><span id="lisaaRahaaArvo">0</span> <img src="img/kolikko0.png" alt="(HR)" style="height:24px;margin-bottom:-6px;" /> lisää</b>. Pelaa peliä tienataksesi nämä rahat.
			</p>
			<form method="dialog" class="buttonDock">
				<button class="but red">&#10005;&emsp;Sulje</button>
			</form>
		</dialog>
		<dialog id="infoModal" class="modal">
			<p id="infoModalTeksti"></p>
			<form method="dialog" class="buttonDock">
				<button class="but">OK</button>
			</form>
		</dialog>
		<dialog id="confirmModal" class="modal">
			<p id="confirmModalTeksti"></p>
			<form method="dialog" class="buttonDock">
				<button class="but" value="ei">Ei</button>
				<button class="but red" value="kylla">Kyllä</button>
			</form>
		</dialog>
		<div id="center">
			<div id="canvasContainer">
				<canvas width="960" height="576" style="height:100%;">
					<p>
						<a href="pages/unsupported.html">Selaimesi ei tue peliä</a>
					</p>
				</canvas>
			</div>
		</div>
	</body>
</html>
