<!DOCTYPE html>
<html>
	<head>
		<title>Selainta ei tueta</title>
		<meta charset="UTF-8" />
		<link href="https://fonts.googleapis.com/css?family=Oxygen:400,700" rel="stylesheet" />
		<style>
			body{
				font-family:'Oxygen',sans-serif;
				font-size:20px;
				background-color:#E04113;
				color:#FFF;
				text-align:center;
				text-shadow:1px 1px 0 rgba(0,0,0,.5),0 0 8px rgba(0,0,0,.2);
			}
			a{
				color:#0080FF;
				text-decoration:none;
			}
			h1{
				font-size:300%;
				margin:16px;
			}
			h2{
				font-weight:normal;
			}
			p{
				max-width:900px;
				margin-left:auto;
				margin-right:auto;
			}
			.info{
				background-image: radial-gradient(circle closest-side at center, rgba(255,255,255,.25), transparent 100%);
				padding:16px;
				height:100%;
			}
			hr{
				border:0;
				height:1px;
				background-color:#000;
				background-color:rgba(0,0,0,0.2);
			}
		</style>
	</head>
	<body>
		<div class="info">
			<h1>Olemme pahoillamme</h1>
			<p>
				HuhtiRun tarvitsee selaimen, joka tukee HTML5 Canvasta. Selaimesi ei näytä tukevan sitä.
			</p>
			<p>
				Kokeile peliä uudella <a href="https://www.google.com/chrome/">Chromella</a>, <a href="https://www.mozilla.org/firefox/">Firefoxilla</a>, <a href="https://www.microsoft.com/edge">Edgellä</a> tai <a href="https://www.apple.com/safari/">Safarilla</a>.
			</p>
			<hr />
			<p>
				<b>Terveisin,</b><br />
				HuhtiRun-kehitystiimi
			</p>
		</div>
	</body>
</html>
